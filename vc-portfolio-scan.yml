# .github/workflows/vc-portfolio-scan.yml
# Bi-weekly: Scrapes VC portfolio pages for new companies (inserted as "pending").
# Review pending companies in Supabase and set status='approved' to enable job scanning.

name: VC Portfolio Scan (Bi-weekly)

on:
  schedule:
    # Every other Sunday at 10pm ET (3:00 UTC Monday)
    # GitHub cron doesn't support bi-weekly natively — we use a date check in the job.
    - cron: '0 3 * * 1'
  workflow_dispatch: # Manual trigger always runs (skips the bi-weekly check)

jobs:
  scan-portfolios:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check if this is a bi-weekly run
        if: github.event_name == 'schedule'
        id: biweekly
        run: |
          # Run only on even-numbered ISO weeks
          WEEK=$(date +%V)
          if (( WEEK % 2 != 0 )); then
            echo "Skipping — odd week ($WEEK). Runs on even weeks only."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Running — even week ($WEEK)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.biweekly.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.biweekly.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.biweekly.outputs.skip != 'true'
        run: |
          pip install requests beautifulsoup4 lxml playwright
          playwright install chromium
          playwright install-deps

      - name: Scan VC portfolios + enrich stages
        if: steps.biweekly.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python vc_monitor.py --scan-vcs --enrich-stages
