# .github/workflows/job-scan.yml
# Mon + Thu: Scrapes jobs from companies that already have a careers page.
# Does NOT re-discover careers pages — run the discover workflow for that.

name: GT Job Scraper

on:
  schedule:
    - cron: '0 13 * * 1,4'  # Monday + Thursday at 9am ET (13:00 UTC)
  workflow_dispatch:
    inputs:
      table:
        description: 'Table to scrape (companies, vc, both)'
        required: false
        default: 'both'
      og_only:
        description: 'Only OG companies (companies table)'
        required: false
        default: 'false'

jobs:
  scrape-vc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      - name: Scrape VC portfolio companies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python job_scraper.py --table vc --scrape

  scrape-og:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      - name: Scrape OG member companies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python job_scraper.py --table companies --og-only --scrape
