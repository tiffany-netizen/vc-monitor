# .github/workflows/job-scan.yml
# Mon + Thu: Scrapes jobs from companies that already have a careers page.
# Does NOT re-discover careers pages — run the discover workflow for that.

name: GT Job Scraper

on:
  schedule:
    - cron: '0 13 * * 1,4'  # Monday + Thursday at 9am ET (13:00 UTC)
  workflow_dispatch:
    inputs:
      table:
        description: 'Table to scrape (companies, vc, both)'
        required: false
        default: 'both'
      og_only:
        description: 'Only OG companies (companies table)'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      - name: Scrape jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          TABLE="${{ github.event.inputs.table || 'both' }}"
          OG_FLAG=""
          if [ "${{ github.event.inputs.og_only }}" = "true" ]; then
            OG_FLAG="--og-only"
          fi

          if [ "$TABLE" = "both" ] || [ "$TABLE" = "vc" ]; then
            echo "=== Scraping VC portfolio companies ==="
            python job_scraper.py --table vc --scrape
          fi

          if [ "$TABLE" = "both" ] || [ "$TABLE" = "companies" ]; then
            echo "=== Scraping OG member companies ==="
            python job_scraper.py --table companies $OG_FLAG --scrape
          fi
