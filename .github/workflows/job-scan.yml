# .github/workflows/job-scan.yml
# Mon + Wed + Fri: Runs discover (for companies without careers_url) then scrape.
# Discovery auto-skips companies that already have a careers_url set.

name: GT Job Scraper

on:
  schedule:
    - cron: '0 5 * * 1,3,5'   # Mon/Wed/Fri 1:00 AM ET (05:00 UTC). Nominal early so ~4–5.5h GH Actions delay still starts ~5–6:30 AM ET; ~1–1.5h runtime finishes before ~8 AM ET morning brief.
  workflow_dispatch:
    inputs:
      table:
        description: 'Table to scrape (companies, vc, both)'
        required: false
        default: 'both'
      og_only:
        description: 'Only OG companies (companies table)'
        required: false
        default: 'false'
      mode:
        description: 'Mode (all, discover, scrape)'
        required: false
        default: 'all'
      company_id:
        description: 'Rescan one company by id (uuid for companies, numeric for vc); overrides mode'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      - name: Run scraper
        # Inputs reach the shell ONLY through env. Interpolating ${{ inputs.* }} into
        # the run block expands them into script TEXT before bash runs — a crafted
        # dispatch input would execute on the runner with access to SUPABASE_KEY.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TABLE_INPUT: ${{ github.event.inputs.table || 'both' }}
          MODE_INPUT: ${{ github.event.inputs.mode || 'all' }}
          COMPANY_INPUT: ${{ github.event.inputs.company_id }}
          OG_ONLY_INPUT: ${{ github.event.inputs.og_only }}
        run: |
          TABLE="$TABLE_INPUT"
          MODE="$MODE_INPUT"
          COMPANY="$COMPANY_INPUT"
          OG_FLAG=""
          if [ "$OG_ONLY_INPUT" = "true" ]; then
            OG_FLAG="--og-only"
          fi
          MODE_FLAG="--$MODE"

          # Single-company rescan (dispatched from the GT dashboard agent's
          # rescan_company tool). Chain enrichment below still fires.
          if [ -n "$COMPANY" ]; then
            if ! printf '%s' "$COMPANY" | grep -Eq '^[0-9a-fA-F-]+$'; then
              echo "Invalid company_id: must be a uuid or numeric id" >&2
              exit 1
            fi
            T="$TABLE"
            if [ "$T" = "both" ]; then T="companies"; fi
            echo "=== Single company rescan ($T: $COMPANY) ==="
            python job_scraper.py --table "$T" --company "$COMPANY"
            exit 0
          fi

          if [ "$TABLE" = "both" ] || [ "$TABLE" = "vc" ]; then
            echo "=== VC portfolio companies: $MODE ==="
            python job_scraper.py --table vc $MODE_FLAG
          fi

          if [ "$TABLE" = "both" ] || [ "$TABLE" = "companies" ]; then
            echo "=== Companies table: $MODE $OG_FLAG ==="
            python job_scraper.py --table companies $OG_FLAG $MODE_FLAG
          fi

      # Fires once, after both tables are scraped: company enrich (S10) -> contact
      # enrich (4657611) in Make. No-op unless MAKE_API_KEY secret is set and both
      # scenarios are active. Skipped for discover-only runs.
      - name: Chain enrichment (company then contact)
        if: ${{ (github.event.inputs.mode || 'all') != 'discover' }}
        env:
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
        run: python job_scraper.py --chain-enrich
