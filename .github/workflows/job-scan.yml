# .github/workflows/job-scan.yml
# Mon + Thu: Discovers careers pages and scrapes jobs from vc_portfolio_companies.
# Inserts matching jobs into the vc_jobs table.

name: GT Job Scraper

on:
  schedule:
    - cron: '0 13 * * 1,4'  # Monday + Thursday at 9am ET (13:00 UTC)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Discover careers pages + scrape jobs (VC table only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python job_scraper.py --table vc --all
